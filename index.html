<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Python 数据分析 · 每天 15 分钟</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header id="topbar">
    <div class="brand">
      <div class="logo" id="logoSlot"></div>
      <div class="brand-txt">
        <b>Python 数据分析</b>
        <small>百词斩式 · 每天 15 分钟 · 5 周</small>
      </div>
    </div>
    <div class="hud">
      <div class="chip" id="chipStreak">🔥 0 天</div>
      <div class="chip" id="chipXp">⭐ Lv.1</div>
      <button class="icon-btn" id="btnSettings" title="设置 / 存档">⚙</button>
    </div>
  </header>

  <main id="main">
    <section class="view" id="view-home"></section>
    <section class="view" id="view-learn"></section>
    <section class="view" id="view-result"></section>
    <section class="view" id="view-map"></section>
    <section class="view" id="view-wrong"></section>
  </main>

  <footer id="bottombar">
    <span id="footNote">进度存在这台电脑的浏览器里 · 随时可导出</span>
  </footer>
</div>

<div id="toast" class="toast"></div>
<div id="modal" class="modal-mask hidden"><div class="modal" id="modalBody"></div></div>

<script src="data/w1.js"></script>
<script src="data/w2.js"></script>
<script src="data/w3.js"></script>
<script src="data/w4.js"></script>
<script src="data/w5.js"></script>
<script src="app.js"></script>
</body>
</html>
